# Run the project checks on every pull request and on main.
# Works on GitHub Actions and on Gitea/Forgejo Actions (same syntax). Remove it if the repo stays local only.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/testing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync --locked
      # The same checks as before a pull request on a dev machine: .project/config.json → delivery.checks
      # (lint, format, types, tests, board, and the coverage floor when one is set). See docs/testing.md §4.
      - name: Checks
        run: node tools/checks/run-checks.mjs
